blueprint:
  name: "SONOFF TRVZB (ZHA) — External Temperature Sync"
  description: >
    Sends a Celsius room temperature to a SONOFF TRVZB Gen 1 through ZHA
    when the reading changes, on a configurable schedule, at startup, and
    when the configured entities become ready. Select the valve and room
    sensor devices to detect their entities automatically. Writes require heat mode,
    an enabled external sensor switch, and a closed window if configured.
    Disable older temperature sync automations for this valve before enabling this one.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    trv_device:
      name: SONOFF TRVZB valve
      description: Select the ZHA valve. Its climate entity, switch, and number are detected automatically.
      default: ""
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: SONOFF
              model: TRVZB
    room_sensor_device:
      name: Room temperature sensor device
      description: Select a SONOFF SNZB-02 series temperature sensor connected through ZHA.
      default: ""
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: SONOFF
              model: SNZB-02
            - integration: zha
              manufacturer: SONOFF
              model: SNZB-02B
            - integration: zha
              manufacturer: SONOFF
              model: SNZB-02D
            - integration: zha
              manufacturer: SONOFF
              model: SNZB-02DR2
            - integration: zha
              manufacturer: SONOFF
              model: SNZB-02LD
            - integration: zha
              manufacturer: SONOFF
              model: SNZB-02P
            - integration: zha
              manufacturer: eWeLink
              model: SNZB-02P
            - integration: zha
              manufacturer: SONOFF
              model: SNZB-02UL
            - integration: zha
              manufacturer: SONOFF
              model: SNZB-02WD
    optional_window_contact:
      name: Window / skylight sensor (optional)
      description: >
        Optional binary sensor (off = confirmed closed). If selected, no
        temperature is written while the window is open or unavailable,
        including before a separate automation turns the TRV off.
        Leave blank if not used.
      default: ""
      selector:
        entity:
          filter:
            - domain: binary_sensor
    advanced:
      name: Advanced settings
      description: Adjust the refresh schedule or override entity detection. Existing entity selections are preserved.
      collapsed: true
      input:
        refresh_interval_minutes:
          name: Refresh interval
          description: Interval between scheduled writes, including when the temperature stays the same.
          default: 60
          selector:
            number:
              min: 1
              max: 90
              step: 1
              unit_of_measurement: min
              mode: box
        hourly_refresh_minute:
          name: Refresh minute offset (optional)
          description: >
            Shifts the schedule by this many minutes, modulo the interval.
            Use different offsets to stagger scheduled writes across valves.
          default: 7
          selector:
            number:
              min: 0
              max: 59
              step: 1
              mode: box
        room_temperature:
          name: Room temperature sensor
          description: External sensor providing room temperature in degrees Celsius.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        trv_climate:
          name: SONOFF TRVZB thermostat
          description: The TRVZB climate entity (for example, Radiator Corridor Thermostat).
          default: ""
          selector:
            entity:
              filter:
                - domain: climate
        trv_external_temperature:
          name: TRVZB external temperature value
          description: ZHA external temperature value number with its unit set to Celsius.
          default: ""
          selector:
            entity:
              filter:
                - domain: number
        trv_external_sensor_switch:
          name: TRVZB external temperature sensor switch
          description: ZHA switch entity ending in external_temperature_sensor.
          default: ""
          selector:
            entity:
              filter:
                - domain: switch

# Resolve registry IDs in limited templates so the event listener can subscribe
# to a single source entity before its state becomes available.
trigger_variables:
  valve_device: !input trv_device
  sensor_device: !input room_sensor_device
  source_override: !input room_temperature
  climate_override: !input trv_climate
  number_override: !input trv_external_temperature
  switch_override: !input trv_external_sensor_switch
  window_contact: !input optional_window_contact
  source_sensor: >-
    {% set entities = device_entities(sensor_device) if sensor_device else [] %}
    {% if source_override %}
      {{ source_override if not sensor_device or source_override in entities else '' }}
    {% else %}
      {% set matches = entities | select('match', '^sensor[.].*_temperature(_[0-9]+)?$') | list %}
      {{ matches[0] if matches | count == 1 else '' }}
    {% endif %}
  valve_entities: >-
    {% set entities = device_entities(valve_device) if valve_device else [] %}
    {% macro resolve(override, pattern) -%}
      {%- if override -%}
        {{ override if not valve_device or override in entities else '' }}
      {%- else -%}
        {%- set matches = entities | select('match', pattern) | list -%}
        {{ matches[0] if matches | count == 1 else '' }}
      {%- endif -%}
    {%- endmacro %}
    {{ {
      'climate': resolve(climate_override, '^climate[.]'),
      'number': resolve(number_override, '^number[.].*_external_temperature_sensor_value(_[0-9]+)?$'),
      'switch': resolve(switch_override, '^switch[.].*_external_temperature_sensor(_[0-9]+)?$')
    } }}
  climate_entity: "{{ valve_entities.climate }}"
  temperature_number: "{{ valve_entities.number }}"
  external_switch: "{{ valve_entities.switch }}"

triggers:
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ source_sensor }}"
    id: sensor_changed
  - trigger: time_pattern
    minutes: "*"
    seconds: 0
    id: refresh_tick
  # A false-to-true transition handles delayed startup, reconnects, heat mode,
  # switch enable, and restoration of a confirmed closed window.
  - trigger: template
    id: entities_ready
    value_template: &ready >-
      {{ climate_entity != '' and external_switch != ''
         and source_sensor != '' and temperature_number != ''
         and (not valve_device or source_sensor not in device_entities(valve_device))
         and is_state(climate_entity, 'heat')
         and is_state(external_switch, 'on')
         and is_number(states(source_sensor))
         and state_attr(source_sensor, 'device_class') == 'temperature'
         and state_attr(source_sensor, 'unit_of_measurement') == '°C'
         and is_number(states(temperature_number))
         and state_attr(temperature_number, 'unit_of_measurement') == '°C'
         and (window_contact == '' or is_state(window_contact, 'off')) }}
  - trigger: homeassistant
    event: start
    id: home_assistant_started

variables:
  refresh_interval: !input refresh_interval_minutes
  refresh_offset: !input hourly_refresh_minute

conditions:
  - alias: Check the refresh schedule or accept an event
    condition: template
    value_template: >-
      {% set trigger_id = trigger.id | default('') if trigger is defined else '' %}
      {% if trigger_id == 'refresh_tick' %}
        {% set minute = (as_timestamp(trigger.now) // 60) | int %}
        {{ (minute - (refresh_offset | int)) % (refresh_interval | int) == 0 }}
      {% elif trigger_id == 'sensor_changed' %}
        {# The readiness trigger already handles recovery from invalid source data. #}
        {% set old = trigger.event.data.old_state %}
        {% set new = trigger.event.data.new_state %}
        {{ trigger.event.data.entity_id == source_sensor
           and old is not none and new is not none
           and old.state != new.state and is_number(old.state)
           and old.attributes.get('device_class') == 'temperature'
           and old.attributes.get('unit_of_measurement') == '°C' }}
      {% else %}
        {{ true }}
      {% endif %}
  - alias: Accept runs only while the entities are ready
    condition: template
    value_template: *ready

actions:
  - variables:
      room_reading: "{{ states(source_sensor) | float(none) }}"
      value_to_write: "{{ room_reading | round(1) if is_number(room_reading) else none }}"
  - alias: Check the reading against the target number's range
    condition: template
    value_template: >-
      {% set minimum = state_attr(temperature_number, 'min') %}
      {% set maximum = state_attr(temperature_number, 'max') %}
      {{ is_number(value_to_write) and is_number(minimum) and is_number(maximum)
         and (minimum | float) <= value_to_write <= (maximum | float)
         and room_reading == (states(source_sensor) | float(none)) }}
  - alias: Recheck the live states immediately before dispatch
    condition: template
    value_template: *ready
  - action: number.set_value
    target:
      entity_id: "{{ temperature_number }}"
    data:
      value: "{{ value_to_write }}"

mode: queued
max: 2
max_exceeded: silent
